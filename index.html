<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flujos globales de refugiados</title>
  <style>
    :root {
      --bg1: #020d2f;
      --bg2: #00143f;
      --outline: #dff3ff;
      --land: #143564;
      --land-stroke: #c7e8ff;
      --label: #f3f8ff;
      --ukr: #66adff;
      --afg: #f6ac2f;
      --ven: #3de3b2;
      --syr: #b99bff;
      --sdn: #ff8c8c;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1000px 650px at 10% 15%, rgba(59, 130, 246, .22) 0%, transparent 45%),
        radial-gradient(1000px 650px at 85% 85%, rgba(14, 165, 233, .2) 0%, transparent 48%),
        linear-gradient(145deg, var(--bg-a), var(--bg-b));
    }

    #chart {
      width: 100vw;
      height: 100vh;
      display: block;
      background: radial-gradient(120% 100% at 50% 45%, #0b1a30 0%, #060f1f 68%, #050914 100%);
    }

    .origin-label {
      fill: #f8fafc;
      font-size: 11px;
      font-weight: 700;
      paint-order: stroke;
      stroke: rgba(2, 6, 23, 0.92);
      stroke-width: 3px;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .country {
      fill: rgba(8, 28, 58, 0.68);
      stroke: rgba(255, 255, 255, 0.85);
      stroke-width: 0.75;
    }

    .origin-country {
      fill: rgba(255, 255, 255, 0.92);
      stroke: rgba(255, 255, 255, 0.98);
      stroke-width: 1;
    }

    .coastline-glow {
      fill: none;
      stroke: rgba(191, 239, 255, 0.55);
      stroke-width: 8;
      filter: url(#coastGlow);
      pointer-events: none;
    }

    .coastline-edge {
      fill: none;
      stroke: rgba(255, 255, 255, 0.82);
      stroke-width: 1.25;
      pointer-events: none;
    }

    .guide {
      fill: none;
      stroke-linecap: round;
      opacity: 0.23;
      stroke-width: 1.1;
    }

    .arrow {
      stroke-width: 1.2;
      fill: none;
      opacity: 0.9;
    }

    .origin-node {
      stroke: #e2e8f0;
      stroke-width: 1;
    }

    .dest-node {
      fill: #cbd5e1;
      stroke: #e2e8f0;
      stroke-width: 1;
    }

    .error {
      fill: #fecaca;
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
      background:
        radial-gradient(circle at 20% 30%, #0a2d63 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #0f2b57 0%, transparent 40%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      font-family: Inter, Segoe UI, Roboto, system-ui, -apple-system, sans-serif;
    }

    svg {
      width: 100vw;
      height: 100vh;
      display: block;
      filter: drop-shadow(0 0 18px rgba(174, 226, 255, 0.12));
    }

    .land {
      fill: rgba(15, 46, 88, 0.86);
      stroke: var(--land-stroke);
      stroke-width: 1.25;
      filter: drop-shadow(0 0 7px rgba(206, 236, 255, 0.45));
    }

    .origin-dot {
      stroke: #fff;
      stroke-width: 0.8;
      filter: drop-shadow(0 0 4px currentColor);
    }

    .label {
      fill: var(--label);
      font-size: 14px;
      font-weight: 700;
      paint-order: stroke;
      stroke: rgba(2, 9, 28, 0.8);
      stroke-width: 3px;
      stroke-linejoin: round;
    }

    .flow {
      fill: none;
      stroke-linecap: round;
      opacity: 0.9;
      filter: drop-shadow(0 0 5px currentColor);
      stroke-dasharray: 2 10;
      animation: flowMove 5s linear infinite;
    }

    .flow.light { opacity: 0.55; }

    @keyframes flowMove {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -180; }
    }

    .spark {
      fill: currentColor;
      opacity: 0;
      animation: pulse 4.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 20%, 100% { opacity: 0; transform: scale(0.6); }
      35%, 60% { opacity: 0.95; transform: scale(1.2); }
    }
  </style>
</head>

      { from: 'Sudan', to: 'Chad', value: 0.78, lat: 12.1, lon: 15.0 },
      { from: 'Sudan', to: 'South Sudan', value: 0.63, lat: 4.9, lon: 31.6 },
      { from: 'Sudan', to: 'Egypt', value: 0.56, lat: 30.0, lon: 31.2 },
      { from: 'Sudan', to: 'Ethiopia', value: 0.41, lat: 9.0, lon: 38.8 },
      { from: 'Sudan', to: 'Libya', value: 0.22, lat: 32.9, lon: 13.2 },
      { from: 'Sudan', to: 'Uganda', value: 0.17, lat: 0.31, lon: 32.6 },
      { from: 'Sudan', to: 'CAR', value: 0.14, lat: 4.4, lon: 18.6 },
      { from: 'Sudan', to: 'Kenya', value: 0.12, lat: -1.3, lon: 36.8 },
      { from: 'Sudan', to: 'Eritrea', value: 0.10, lat: 15.3, lon: 38.9 },
      { from: 'Sudan', to: 'Saudi Arabia', value: 0.09, lat: 24.7, lon: 46.7 },
      { from: 'Sudan', to: 'Djibouti', value: 0.08, lat: 11.6, lon: 43.1 },
      { from: 'Sudan', to: 'Rwanda', value: 0.07, lat: -1.9, lon: 30.1 },
      { from: 'Sudan', to: 'Yemen', value: 0.06, lat: 15.3, lon: 44.2 },
      { from: 'Sudan', to: 'Niger', value: 0.05, lat: 13.5, lon: 2.1 },
      { from: 'Sudan', to: 'DR Congo', value: 0.05, lat: -4.3, lon: 15.3 },
    ];

    const originByName = new Map(origins.map((o) => [o.name, o]));
    const maxFlow = Math.max(...flows.map((f) => f.value));
    const minFlow = Math.min(...flows.map((f) => f.value));

    const PARTICLE_MIN = 8;
    const PARTICLE_MAX = 90;
    const PARTICLE_RADIUS = 1.2;

    const svg = d3.select('#chart');
    let worldData = null;

    const makeProjection = typeof d3.geoRobinson === 'function' ? d3.geoRobinson : d3.geoNaturalEarth1;
    let width = 0;
    let height = 0;
    let projection;
    let path;

    function updateProjection() {
      const bounds = svg.node().getBoundingClientRect();
      width = bounds.width;
      height = bounds.height;
      projection = makeProjection().fitExtent([[14, 12], [width - 14, height - 12]], { type: 'Sphere' });
      path = d3.geoPath(projection);
    }

    updateProjection();

    const gMap = svg.append('g');
    const gGuides = svg.append('g');
    const gNodes = svg.append('g');
    const gLabels = svg.append('g');
    const gParticles = svg.append('g');

    const particles = [];
    let frameId = null;
    let prevT = performance.now();

    function flowToParticleCount(value) {
      const norm = (value - minFlow) / (maxFlow - minFlow || 1);
      return Math.round(PARTICLE_MIN + norm * (PARTICLE_MAX - PARTICLE_MIN));
    }

    function flowGroupMeta() {
      const grouped = new Map();
      flows.forEach((flow) => {
        if (!grouped.has(flow.from)) grouped.set(flow.from, []);
        grouped.get(flow.from).push(flow);
      });

      const meta = new Map();
      grouped.forEach((group) => {
        group.slice().sort((a, b) => b.value - a.value).forEach((flow, index) => {
          meta.set(flow, { index, count: group.length });
        });
      });
      return meta;
    }

    function buildCurvePoints(p0, p2, curveStrength, segments = 56) {
      const mx = (p0[0] + p2[0]) / 2;
      const my = (p0[1] + p2[1]) / 2;
      const dx = p2[0] - p0[0];
      const dy = p2[1] - p0[1];
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len;
      const ny = dx / len;
      const control = [mx + nx * len * curveStrength, my + ny * len * curveStrength];

      const pts = [];
      for (let i = 0; i <= segments; i += 1) {
        const t = i / segments;
        const x = (1 - t) * (1 - t) * p0[0] + 2 * (1 - t) * t * control[0] + t * t * p2[0];
        const y = (1 - t) * (1 - t) * p0[1] + 2 * (1 - t) * t * control[1] + t * t * p2[1];
        pts.push([x, y]);
      }
      return pts;
    }

    function sampleOffsetPoint(points, t, laneOffset) {
      const scaled = t * (points.length - 1);
      const i = Math.floor(scaled);
      const local = scaled - i;
      const p1 = points[i];
      const p2 = points[Math.min(i + 1, points.length - 1)];
      const baseX = p1[0] + (p2[0] - p1[0]) * local;
      const baseY = p1[1] + (p2[1] - p1[1]) * local;

      const tx = p2[0] - p1[0];
      const ty = p2[1] - p1[1];
      const len = Math.hypot(tx, ty) || 1;
      const nx = -ty / len;
      const ny = tx / len;

      return [baseX + nx * laneOffset, baseY + ny * laneOffset];
    }

    function stopAnimation() {
      if (frameId) cancelAnimationFrame(frameId);
      frameId = null;
      particles.length = 0;
      gParticles.selectAll('*').remove();
    }

    function startAnimation() {
      prevT = performance.now();

      function tick(now) {
        const dt = Math.min(40, now - prevT);
        prevT = now;

        const pulseT = now * 0.002;
        for (const p of particles) {
          p.phase = (p.phase + p.speed * dt) % 1;
          const [x, y] = sampleOffsetPoint(p.route, p.phase, p.laneOffset);
          const alpha = p.baseOpacity + Math.sin(pulseT + p.twinklePhase) * 0.14;
          p.node
            .attr('cx', x)
            .attr('cy', y)
            .attr('fill-opacity', Math.max(0.2, Math.min(0.92, alpha)));
        }

        frameId = requestAnimationFrame(tick);
      }

      frameId = requestAnimationFrame(tick);
    }

    function renderWorld(world) {
      const countries = topojson.feature(world, world.objects.countries);
      const land = topojson.merge(world, world.objects.countries.geometries);
      const originCoords = origins.map((o) => [o.lon, o.lat]);

      const defs = svg.append('defs');
      const blur = defs.append('filter')
        .attr('id', 'coastGlow')
        .attr('x', '-50%')
        .attr('y', '-50%')
        .attr('width', '200%')
        .attr('height', '200%');
      blur.append('feGaussianBlur').attr('stdDeviation', 2.6);

      gMap.append('path').datum({ type: 'Sphere' }).attr('d', path).attr('fill', 'rgba(4, 19, 41, 0.76)');
      gMap.append('path').datum(land).attr('class', 'coastline-glow').attr('d', path);
      gMap.append('path').datum(land).attr('class', 'coastline-edge').attr('d', path);
      gMap.selectAll('.country')
        .data(countries.features)
        .join('path')
        .attr('class', (feature) => {
          const isOriginCountry = originCoords.some((coord) => d3.geoContains(feature, coord));
          return isOriginCountry ? 'country origin-country' : 'country';
        })
        .attr('d', path);
    }

    function renderFlowsAndNodes() {
      const meta = flowGroupMeta();

      gGuides.selectAll('*').remove();
      gNodes.selectAll('*').remove();
      gLabels.selectAll('*').remove();
      stopAnimation();

      const seenDest = new Set();

      flows.forEach((f) => {
        const origin = originByName.get(f.from);
        const start = projection([origin.lon, origin.lat]);
        const end = projection([f.lon, f.lat]);
        if (!start || !end) return;

        const group = meta.get(f);
        const center = (group.count - 1) / 2;
        const fan = (group.index - center) / Math.max(center, 1);
        const signedCurve = (0.10 + Math.abs(fan) * 0.2) * (fan >= 0 ? 1 : -1);

        const route = buildCurvePoints(start, end, signedCurve, 56);
        const linePath = d3.line().curve(d3.curveLinear)(route);

        gGuides.append('path')
          .attr('class', 'guide')
          .attr('d', linePath)
          .attr('stroke', origin.color);

        const tail = route[route.length - 1];
        const prev = route[route.length - 2];
        const vx = tail[0] - prev[0];
        const vy = tail[1] - prev[1];
        const vlen = Math.hypot(vx, vy) || 1;
        const ux = vx / vlen;
        const uy = vy / vlen;
        const px = -uy;
        const py = ux;
        const arrowSize = 5.8;

        gGuides.append('path')
          .attr('class', 'arrow')
          .attr('stroke', origin.color)
          .attr('d', `M ${tail[0] - ux * 0.5} ${tail[1] - uy * 0.5} L ${tail[0] - ux * arrowSize + px * arrowSize * 0.45} ${tail[1] - uy * arrowSize + py * arrowSize * 0.45} M ${tail[0] - ux * 0.5} ${tail[1] - uy * 0.5} L ${tail[0] - ux * arrowSize - px * arrowSize * 0.45} ${tail[1] - uy * arrowSize - py * arrowSize * 0.45}`);

        const particleCount = flowToParticleCount(f.value);
        const laneSpread = 1.8 + Math.min(13, Math.sqrt(particleCount) * 0.9);
        const baseSpeed = 0.00032 + (f.value / maxFlow) * 0.00042;

        for (let i = 0; i < particleCount; i += 1) {
          const laneOffset = (Math.random() * 2 - 1) * laneSpread;
          const phase = Math.random();
          const speed = baseSpeed * (0.75 + Math.random() * 0.75);
          const [x, y] = sampleOffsetPoint(route, phase, laneOffset);
          const baseOpacity = 0.62 + Math.random() * 0.18;
          const twinklePhase = Math.random() * Math.PI * 2;

          const node = gParticles.append('circle')
            .attr('class', 'particle')
            .attr('cx', x)
            .attr('cy', y)
            .attr('r', PARTICLE_RADIUS)
            .attr('fill', origin.color)
            .attr('fill-opacity', baseOpacity);

          particles.push({ node, route, phase, laneOffset, speed, baseOpacity, twinklePhase });
        }

        if (!seenDest.has(f.to)) {
          seenDest.add(f.to);
          gNodes.append('circle').attr('class', 'dest-node').attr('cx', end[0]).attr('cy', end[1]).attr('r', 1.9);
        }
      });

      origins.forEach((o) => {
        const p = projection([o.lon, o.lat]);
        if (!p) return;

        gNodes.append('circle')
          .attr('class', 'origin-node')
          .attr('cx', p[0])
          .attr('cy', p[1])
          .attr('r', 4.8)
          .attr('fill', '#ffffff');

        gLabels.append('text')
          .attr('class', 'origin-label')
          .attr('x', p[0] + 7)
          .attr('y', p[1] - 7)
          .text(o.name);
      });

      startAnimation();
    }

    function showError(message) {
      svg.append('text')
        .attr('class', 'error')
        .attr('x', width / 2)
        .attr('y', height / 2)
        .text(message);
    }

    async function loadWorldData() {
      const sources = [
        'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json',
        'https://unpkg.com/world-atlas@2/countries-110m.json',
      ];

      for (const source of sources) {
        try {
          const world = await d3.json(source);
          if (world?.objects?.countries) return world;
        } catch (error) {
          console.warn('Failed loading map source:', source, error);
        }
      }

      throw new Error('World data unavailable');
    }

    function rerender() {
      if (!worldData) return;
      updateProjection();
      gMap.selectAll('*').remove();
      gGuides.selectAll('*').remove();
      gNodes.selectAll('*').remove();
      gLabels.selectAll('*').remove();
      stopAnimation();
      renderWorld(worldData);
      renderFlowsAndNodes();
    }

    const debouncedResize = (() => {
      let timer = null;
      return () => {
        clearTimeout(timer);
        timer = setTimeout(rerender, 180);
      };
    })();

    window.addEventListener('resize', debouncedResize);

    async function init() {
      try {
        worldData = await loadWorldData();
        rerender();
      } catch (error) {
        console.error(error);
        showError('Map data failed to load. Please refresh.');
      }
    }

    init();
  </script>
